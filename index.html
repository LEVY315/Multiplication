<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multiplication Quiz Challenge</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      text-align: center;
    }
    .screen {
      display: none;
    }
    #start-screen {
      display: block;
    }
    h1 {
      font-size: 2em;
    }
    button {
      padding: 10px 20px;
      font-size: 1.2em;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #question-container {
      font-size: 2em;
    }
    #timer, #score {
      font-size: 1.5em;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div id="start-screen" class="screen">
    <h1>Welcome to the Multiplication Quiz Challenge!</h1>
    <button id="start-btn">Start Game</button>
  </div>

  <div id="game-screen" class="screen">
    <div id="question-container">
      <span id="question">5 x 6</span>
    </div>
    <input type="number" id="answer" placeholder="Your Answer" autofocus>
    <button id="submit-btn">Submit</button>
    <div id="timer">Time: 60s</div>
    <div id="score">Score: 0</div>
  </div>

  <div id="game-over-screen" class="screen">
    <h1>Game Over!</h1>
    <p>Your Final Score: <span id="final-score"></span></p>
    <button id="restart-btn">Restart</button>
  </div>

  <script>
    let currentScore = 0;
    let timer;
    let timeRemaining = 60;
    let questionCount = 0;
    const maxQuestions = 10;

    const startBtn = document.getElementById('start-btn');
    const gameScreen = document.getElementById('game-screen');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const submitBtn = document.getElementById('submit-btn');
    const answerInput = document.getElementById('answer');
    const scoreDisplay = document.getElementById('score');
    const timerDisplay = document.getElementById('timer');
    const questionDisplay = document.getElementById('question');
    const finalScoreDisplay = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');

    startBtn.addEventListener('click', startGame);
    submitBtn.addEventListener('click', checkAnswer);
    restartBtn.addEventListener('click', restartGame);

    function startGame() {
      startScreen.style.display = 'none';
      gameScreen.style.display = 'block';
      startTimer();
      generateQuestion();
    }

    function startTimer() {
      timer = setInterval(() => {
        timeRemaining--;
        timerDisplay.innerText = `Time: ${timeRemaining}s`;
        if (timeRemaining <= 0 || questionCount >= maxQuestions) {
          endGame();
        }
      }, 1000);
    }

    function generateQuestion() {
      const num1 = Math.floor(Math.random() * 12) + 1;
      const num2 = Math.floor(Math.random() * 12) + 1;
      questionDisplay.innerText = `${num1} x ${num2}`;
      questionDisplay.dataset.answer = num1 * num2;
    }

    function checkAnswer() {
      const userAnswer = parseInt(answerInput.value);
      const correctAnswer = parseInt(questionDisplay.dataset.answer);
      if (userAnswer === correctAnswer) {
        currentScore += 10;
      } else {
        currentScore -= 5;
      }
      scoreDisplay.innerText = `Score: ${currentScore}`;
      questionCount++;
      generateQuestion();
      answerInput.value = '';
    }

    function endGame() {
      clearInterval(timer);
      finalScoreDisplay.innerText = currentScore;
      gameScreen.style.display = 'none';
      gameOverScreen.style.display = 'block';
    }

    function restartGame() {
      currentScore = 0;
      timeRemaining = 60;
      questionCount = 0;
      scoreDisplay.innerText = `Score: 0`;
      timerDisplay.innerText = `Time: 60s`;
      startGame();
    }
  </script>

</body>
</html>
